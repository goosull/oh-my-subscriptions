name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  oms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      # oms is one stdlib-only file, so there is nothing to install
      - run: ./bin/oms --selftest
      - run: python3 .github/check-docs.py
      - run: python3 .github/check-wired.py
      - name: a fresh machine can add an account and be told what is missing
        run: |
          export OMS_HOME="$RUNNER_TEMP/oms"
          ./bin/oms status 2>&1 | grep -q "no accounts yet"
          ./bin/oms add probe codex
          ./bin/oms status | grep -q probe
          ./bin/oms config | grep -q probe
          ./bin/oms remove probe --purge
          # doctor must fail loudly on a machine with nothing set up
          ! ./bin/oms doctor

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: agent
      - run: bun run typecheck
        working-directory: agent
      - run: bun test
        working-directory: agent
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: npm ci --ignore-scripts
      - run: bun test tests
      - run: agent/node_modules/.bin/tsc --noEmit --skipLibCheck --module nodenext --moduleResolution nodenext --target es2022 extensions/oms.ts extensions/routing.ts
      - name: the demo and the cost model still run
        run: bun run cost.ts
        working-directory: agent
